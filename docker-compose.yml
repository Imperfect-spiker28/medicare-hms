services:
  postgres:
    image: postgres:16-alpine
    container_name: medicare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: medicare_hms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d medicare_hms"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medicare-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/medicare_hms
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: dev-only-insecure-secret-change-me-which-is-at-least-256-bits-long-for-hmac-sha-security
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medicare-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      BACKEND_INTERNAL_URL: http://backend:8080
    depends_on:
      - backend

volumes:
  pgdata:
    driver: local
