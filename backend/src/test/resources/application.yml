server:
  port: 0

spring:
  application:
    name: medicare-backend-test

  datasource:
    url: jdbc:h2:mem:medicare_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: 
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
        auto_quote_keyword: true
    show-sql: false
    open-in-view: false

  flyway:
    enabled: false

jwt:
  secret: dev-only-insecure-secret-change-me-which-is-at-least-256-bits-long-for-hmac-sha-security
  expiration-ms: 604800000

cors:
  allowed-origins: http://localhost:3000
