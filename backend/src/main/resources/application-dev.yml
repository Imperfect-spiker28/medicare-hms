# Development profile with local file-backed H2 running in PostgreSQL compatibility mode
# Enables immediate out-of-the-box execution even if a local PostgreSQL daemon is not running.
server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:file:./data/medicare_hms;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: 
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
        auto_quote_keyword: true
    show-sql: false
    open-in-view: false

  flyway:
    enabled: false

jwt:
  secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-which-is-at-least-256-bits-long-for-hmac-sha-security}
  expiration-ms: 604800000

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
