server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: medicare-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

jwt:
  secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-which-is-at-least-256-bits-long-for-hmac-sha-security}
  expiration-ms: 604800000 # 7 days in milliseconds

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

logging:
  level:
    root: INFO
    com.hospital: DEBUG
    org.springframework.security: INFO
